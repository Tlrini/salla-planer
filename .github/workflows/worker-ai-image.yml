# Builds the AI scan GPU image (worker-ai/) on GitHub's free runners and publishes it to
# ghcr.io/<owner>/salla-ai-worker. RunPod Serverless pulls it from there (the package must be
# public, or RunPod needs registry credentials). Runs when worker-ai/ changes, or by hand.
name: worker-ai image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'worker-ai/**'
      - '.github/workflows/worker-ai-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # The PyTorch CUDA devel base image alone is ~20 GB unpacked; the runner starts with ~14 GB.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/salla-ai-worker" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: worker-ai
          push: true
          provenance: false
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Salla Planner AI scan worker (TRELLIS.2, RunPod Serverless)

      - name: Disk left
        if: always()
        run: df -h /
